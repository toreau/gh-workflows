# container-build-push
#
# Builds and pushes a container image to a registry (build side of the
# supply chain). Uses docker/buildx for platform builds (e.g. linux/arm64)
# and docker/login for registry auth. The pushed image (tagged per `tags`)
# is later SLSA-attested by the caller's own workflow.
#
# Used by: app repos' CI (e.g. toreau/astronomy.aursand.no, toreau/frosta-historielag.no).
name: container-build-push
on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
        description: Full image name, e.g. ghcr.io/toreau/astronomy-api
      dockerfile:
        required: true
        type: string
        description: Path to the Dockerfile
      context:
        required: false
        type: string
        default: "."
        description: Build context directory (default repo root)
      platform:
        required: true
        type: string
        description: Build platform, e.g. linux/amd64
      runner:
        required: false
        type: string
        default: "ubuntu-latest"
        description: Runner for this build, e.g. ubuntu-24.04-arm for arm64
      tags:
        required: true
        type: string
        description: Whitespace/newline-separated tags to push
      registry:
        required: false
        type: string
        default: "ghcr.io"
        description: Registry to authenticate against and push to
    secrets:
      token:
        required: true
        description: GitHub token with packages write scope for the target registry (GITHUB_TOKEN or PAT)
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.token }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platform }}
          push: true
          tags: ${{ inputs.tags }}
