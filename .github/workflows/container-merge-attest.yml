name: container-merge-attest
on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
        description: Subject image name, e.g. ghcr.io/toreau/astronomy-api
      per-arch-tags:
        required: true
        type: string
        description: Whitespace-separated arch-tagged images to merge
      merge-tags:
        required: true
        type: string
        description: Whitespace/newline-separated resulting tags
      attestation-repo:
        required: true
        type: string
        description: Repo to verify attestations against, e.g. toreau/astronomy.aursand.no
      sbom-image:
        required: true
        type: string
        description: Single-arch image to scan for the SBOM (e.g. the first per-arch tag)
      sbom:
        required: false
        type: boolean
        default: true
      verify:
        required: false
        type: boolean
        default: true
    secrets:
      token:
        required: true
    outputs:
      digest:
        description: Multi-arch manifest digest
        value: ${{ jobs.merge.outputs.digest }}
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
jobs:
  merge:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.token }}
      - name: Merge multi-arch manifest
        env:
          MERGE_TAGS: ${{ inputs.merge-tags }}
          ARCH_TAGS: ${{ inputs.per-arch-tags }}
        run: |
          args=()
          for t in $MERGE_TAGS; do args+=(-t "$t"); done
          # shellcheck disable=SC2086
          docker buildx imagetools create "${args[@]}" $ARCH_TAGS
      - name: Resolve multi-arch digest
        id: digest
        env:
          MERGE_TAGS: ${{ inputs.merge-tags }}
        run: |
          first=$(echo "$MERGE_TAGS" | xargs | cut -d' ' -f1)
          d=$(docker buildx imagetools inspect "$first" --format '{{.Manifest.Digest}}')
          echo "digest=$d" >> "$GITHUB_OUTPUT"
          echo "resolved $d"
      - name: Generate SBOM
        if: inputs.sbom
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          image: ${{ inputs.sbom-image }}
          format: spdx-json
          output-file: report.spdx.json
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4
        with:
          subject-name: ${{ inputs.image }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
      - name: Attest SBOM
        if: inputs.sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4
        with:
          subject-name: ${{ inputs.image }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          sbom-path: report.spdx.json
          push-to-registry: true
      - name: Verify attestations
        if: inputs.verify
        env:
          GH_TOKEN: ${{ secrets.token }}
          DIGEST: ${{ steps.digest.outputs.digest }}
          IMAGE: ${{ inputs.image }}
          REPO: ${{ inputs.attestation-repo }}
        run: |
          # Public repo -> no token needed. The attestations API can lag the
          # push-to-registry upload a moment, so retry a few times.
          for i in 1 2 3 4 5; do
            gh attestation verify "oci://${IMAGE}@${DIGEST}" -R "${REPO}" \
              --predicate-type https://slsa.dev/provenance/v1 \
              && { echo "SLSA provenance verified"; break; }
            [ "$i" -lt 5 ] && sleep 5
          done
          gh attestation verify "oci://${IMAGE}@${DIGEST}" -R "${REPO}" \
            --predicate-type https://spdx.dev/Document/v2.3
          echo "attestations verified for ${DIGEST}"
