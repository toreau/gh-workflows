# container-build-attest
#
# Platform-owned trusted builder (generic mechanism, SLSA Build L3-oriented).
# The caller supplies NO workflow_call inputs and NO secrets: the caller's
# automatic github.token is used internally, and application-specific build
# configuration is read from the FIXED path `.github/container-build.json` in
# the caller's exact source revision (the same github.sha the build uses).
#
# This file contains NO application-specific knowledge and NO hardcoded
# repository/org names. A new application only adds its own
# `.github/container-build.json`; gh-workflows is never edited per application.
#
# Trust-boundary invariants (by construction):
#   - no caller inputs/secrets (no image/tags/runner/digest/subject/signer);
#   - source-ref policy: caller github.ref == refs/heads/main (fail-closed);
#   - descriptor and Dockerfile/context come from the SAME caller commit
#     (checkout pinned to github.sha in both validate/config and build);
#   - descriptor is UNTRUSTED caller-controlled data: parsed safely
#     (jq -e/r, string-typed, control chars rejected) before any output/shell use;
#   - generic image policy: ghcr.io + namespace == lowercase(github.repository_owner)
#     (owner restriction, NOT per-application authorization; end-to-end app
#     authorization stays with GHCR package permissions + consumer policy);
#   - build job has no id-token / no attestations (signing material unreachable
#     from user-defined build steps);
#   - SBOM generation runs WITHOUT signing capability (separate job);
#   - signing job is minimal: no checkout, no build, no SBOM tool;
#   - no shared, writable cross-run build cache (no cache-from/cache-to);
#   - digest comes directly from docker/build-push-action output;
#   - attest job independently confirms IMAGE@DIGEST exists (defense in depth).
#
# Only `main-<caller-sha>` is generated (no latest). Deployment identity is the
# digest.
#
# Producer-side `gh attestation verify` is a CONSISTENCY check (fail-fast),
# not consumer enforcement. It self-identifies via the reusable job context
# (job.workflow_ref / job.workflow_sha), so no org/path is hardcoded here.
#
# S3.1 = corrective slice; S4 must verify the resulting identity and
# provenance completeness against the new builder revision before S5 freezes it.
name: container-build-attest

on:
  workflow_call:
    outputs:
      digest:
        description: Exact immutable image digest produced by the trusted build (sha256:<64 hex>)
        value: ${{ jobs.attest.outputs.digest }}

permissions:
  contents: read

jobs:
  validate-config:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      image: ${{ steps.config.outputs.image }}
      dockerfile: ${{ steps.config.outputs.dockerfile }}
      context: ${{ steps.config.outputs.context }}
      platform: ${{ steps.config.outputs.platform }}
      runner: ${{ steps.config.outputs.runner }}
      tag: ${{ steps.config.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Read + validate build descriptor (fail-closed, untrusted source data)
        id: config
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::trusted builder requires caller ref refs/heads/main, got '$GITHUB_REF'"
            exit 1
          fi
          DESC=".github/container-build.json"
          [ -f "$DESC" ] || { echo "::error::missing $DESC in caller source"; exit 1; }
          if ! jq -e 'type == "object"' "$DESC" >/dev/null; then
            echo "::error::$DESC must be a JSON object"; exit 1
          fi
          # Descriptor is caller-controlled: require string-typed fields and
          # reject control characters before any output/shell use.
          get_str() {
            jq -er --arg k "$1" '.[$k] | strings' "$DESC" 2>/dev/null
          }
          image=$(get_str image)    || { echo "::error::$DESC .image must be a string"; exit 1; }
          dockerfile=$(get_str dockerfile) || { echo "::error::$DESC .dockerfile must be a string"; exit 1; }
          context=$(get_str context) || { echo "::error::$DESC .context must be a string"; exit 1; }
          platform=$(get_str platform) || { echo "::error::$DESC .platform must be a string"; exit 1; }
          for v in "$image" "$dockerfile" "$context" "$platform"; do
            [ -n "$v" ] || { echo "::error::empty descriptor value"; exit 1; }
            if printf '%s' "$v" | LC_ALL=C grep -q '[[:cntrl:]]'; then
              echo "::error::control characters not allowed in descriptor value"; exit 1
            fi
          done
          # Generic image policy: ghcr.io + namespace == lowercase(owner).
          OWNER=$(printf '%s' "$GITHUB_REPOSITORY" | cut -d/ -f1 | tr '[:upper:]' '[:lower:]')
          case "$image" in
            ghcr.io/*) ;;
            *) echo "::error::image must be ghcr.io/<owner>/<package>"; exit 1 ;;
          esac
          rest="${image#ghcr.io/}"
          ns="${rest%%/*}"
          pkg="${rest#*/}"
          if [ -z "$ns" ] || [ -z "$pkg" ]; then
            echo "::error::invalid image identity '$image'"
            exit 1
          fi
          if [ "$ns" != "$OWNER" ]; then
            echo "::error::image namespace '$ns' does not match owner '$OWNER'"; exit 1
          fi
          case "$pkg" in
            */*) echo "::error::nested package paths are not supported; use ghcr.io/<owner>/<package>"; exit 1 ;;
            *:*|*@*) echo "::error::image must not contain a tag or digest"; exit 1 ;;
            *[!a-z0-9._-]*) echo "::error::invalid package name '$pkg'"; exit 1 ;;
          esac
          # Platform -> approved GitHub-hosted runner (internal mapping, never caller input).
          case "$platform" in
            linux/amd64) RUNNER="ubuntu-24.04" ;;
            linux/arm64) RUNNER="ubuntu-24.04-arm" ;;
            *) echo "::error::unsupported platform '$platform'"; exit 1 ;;
          esac
          {
            echo "image=$image"
            echo "dockerfile=$dockerfile"
            echo "context=$context"
            echo "platform=$platform"
            echo "runner=$RUNNER"
            echo "tag=$image:main-$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"
          echo "config OK: $image ($platform, $RUNNER)"

  build:
    needs: validate-config
    runs-on: ${{ needs.validate-config.outputs.runner }}
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Validate build paths (inside checkout, fail-closed)
        env:
          WS: ${{ github.workspace }}
          DOCKERFILE: ${{ needs.validate-config.outputs.dockerfile }}
          CONTEXT: ${{ needs.validate-config.outputs.context }}
        run: |
          set -euo pipefail
          require_inside() {
            local p="$1" label="$2"
            [ -n "$p" ] || { echo "::error::$label is empty"; exit 1; }
            case "$p" in
              /*) echo "::error::$label must be a relative path inside the checkout"; exit 1 ;;
            esac
            local abs="$WS/$p"
            local real
            real=$(realpath "$abs") || { echo "::error::cannot resolve $label '$p'"; exit 1; }
            case "$real" in
              "$WS"|"$WS"/*) ;;
              *) echo "::error::$label '$p' resolves outside the checkout workspace"; exit 1 ;;
            esac
            echo "$label OK: $real"
          }
          require_inside "$DOCKERFILE" dockerfile
          require_inside "$CONTEXT" context
          echo "build paths OK"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: ${{ needs.validate-config.outputs.context }}
          file: ${{ needs.validate-config.outputs.dockerfile }}
          platforms: ${{ needs.validate-config.outputs.platform }}
          push: true
          tags: ${{ needs.validate-config.outputs.tag }}
          provenance: false
          sbom: false
          # No cache-from/cache-to: no shared, writable cross-run build cache.
      - name: Validate digest format (fail-closed)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          hex="${DIGEST#sha256:}"
          if [ "$hex" = "$DIGEST" ] || ! printf '%s' "$hex" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::invalid build digest '$DIGEST'"
            exit 1
          fi
          echo "digest format OK: $DIGEST"

  sbom:
    needs: [validate-config, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Generate SBOM against immutable digest
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          image: ${{ needs.validate-config.outputs.image }}@${{ needs.build.outputs.digest }}
          format: spdx-json
          output-file: report.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom
          path: report.spdx.json
          if-no-files-found: error

  attest:
    needs: [validate-config, build, sbom]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ needs.build.outputs.digest }}
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Confirm immutable artifact exists in GHCR (defense in depth)
        env:
          IMAGE: ${{ needs.validate-config.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          ref="${IMAGE}@${DIGEST}"
          docker buildx imagetools inspect "$ref" --format '{{.Name}}@{{.Manifest.Digest}}' \
            || { echo "::error::$ref not found in registry"; exit 1; }
          echo "confirmed: $ref"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sbom
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4
        with:
          subject-name: ${{ needs.validate-config.outputs.image }}
          subject-digest: ${{ needs.build.outputs.digest }}
          push-to-registry: true
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4
        with:
          subject-name: ${{ needs.validate-config.outputs.image }}
          subject-digest: ${{ needs.build.outputs.digest }}
          sbom-path: report.spdx.json
          push-to-registry: true
      - name: Producer-side consistency check (not a trust boundary, self-identifying)
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_JSON: ${{ toJSON(job) }}
          IMAGE: ${{ needs.validate-config.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
          REPO: ${{ github.repository }}
          SRC_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Self-identify the reusable workflow that defines this job via the
          # job context (no org/repo hardcoded): workflow_ref = owner/repo/.github/workflows/<file>.yml@ref
          wf_ref=$(printf '%s' "$JOB_JSON" | jq -r '.workflow_ref // empty')
          wf_sha=$(printf '%s' "$JOB_JSON" | jq -r '.workflow_sha // empty')
          [ -n "$wf_ref" ] || { echo "::error::job.workflow_ref not present"; exit 1; }
          [ -n "$wf_sha" ] || { echo "::error::job.workflow_sha not present"; exit 1; }
          signer="${wf_ref%@*}"
          echo "producer verify: signer-workflow=$signer signer-digest=$wf_sha"
          gh attestation verify "oci://${IMAGE}@${DIGEST}" --repo "$REPO" --bundle-from-oci \
            --signer-workflow "$signer" --signer-digest "$wf_sha" \
            --source-ref refs/heads/main --source-digest "$SRC_SHA" \
            --predicate-type https://slsa.dev/provenance/v1
          echo "producer consistency OK: ${IMAGE}@${DIGEST}"
