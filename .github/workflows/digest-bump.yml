# digest-bump
#
# Updates the image digest in one or more manifest files and commits/pushes
# the change. With `open-pr: true` it pushes to a feature branch and opens
# (or updates) a pull request instead of pushing to the base branch — the
# review-based promotion path used by k8s-research's `app-digest-bump.yml`.
# Tokens {digest12} {sha7} {digest} {sha} are substituted in branch/title/body.
#
# Input safety: `digest` and `image-prefix` are treated strictly as DATA.
# The digest must match ^sha256:[0-9a-f]{64}$, the prefix is matched literally
# (never as a regex/executable), and every file must contain exactly one
# matching image line or the step fails closed. No shell/sed/awk replacement
# programs are constructed from caller input.
#
# Used by: k8s-research `app-digest-bump.yml` (open-pr mode, after the
# attestation gate has verified the proposed digest).
name: digest-bump
on:
  workflow_call:
    inputs:
      file-path:
        required: true
        type: string
        description: Path to the file containing the image line to bump
      file-paths:
        required: false
        type: string
        default: ""
        description: 'Whitespace-separated file paths to bump (overrides file-path); all files get the same digest in one commit'
      image-prefix:
        required: true
        type: string
        description: 'Image line prefix to replace, e.g. "image: ghcr.io/toreau/astronomy-api@sha256:" (matched literally)'
      digest:
        required: true
        type: string
        description: Full digest, e.g. sha256:<hex>; must match ^sha256:[0-9a-f]{64}$
      sha:
        required: false
        type: string
        default: ""
        description: Commit SHA for the default commit message
      commit-message:
        required: false
        type: string
        default: "chore: bump image digest to {digest12} (sha {sha7})"
        description: Commit message; tokens {digest12} {sha7} {digest} {sha} are substituted
      bot-name:
        required: false
        type: string
        default: "k8s-research bot"
        description: Git committer/author name for the bump commit
      bot-email:
        required: false
        type: string
        default: "actions@users.noreply.github.com"
        description: Git committer/author email for the bump commit
      open-pr:
        required: false
        type: boolean
        default: false
        description: Push to a feature branch and open a pull request instead of pushing to the base branch
      base-branch:
        required: false
        type: string
        default: ""
        description: 'PR base branch (default: the repository default branch)'
      head-branch:
        required: false
        type: string
        default: "bump/{sha7}"
        description: PR head branch; tokens {digest12} {sha7} {digest} {sha} are substituted
      pr-title:
        required: false
        type: string
        default: ""
        description: 'PR title; tokens substituted (default: the commit message)'
      pr-body:
        required: false
        type: string
        default: ""
        description: 'PR body; tokens substituted (default: auto-generated body)'
      auto-merge:
        required: false
        type: boolean
        default: false
        description: Enable GitHub auto-merge (squash) on the PR; GitHub merges once required checks/branch-protection conditions are satisfied. Requires the repository setting 'Allow auto-merge'.
    secrets:
      token:
        required: true
        description: GitHub token with contents:write + pull-requests:write for the target repo (PAT or GITHUB_TOKEN)
permissions:
  contents: write
  pull-requests: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          token: ${{ secrets.token }}
      - name: Bump image digest
        id: update
        env:
          FILE: ${{ inputs.file-path }}
          FILE_PATHS: ${{ inputs.file-paths }}
          PREFIX: ${{ inputs.image-prefix }}
          DIGEST: ${{ inputs.digest }}
        run: |
          python3 - <<'PY'
          import os, re, sys

          digest = os.environ["DIGEST"]
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              print("::error::invalid digest; expected sha256:<64 lowercase hex>", file=sys.stderr)
              sys.exit(1)
          prefix = os.environ["PREFIX"]
          new_digest = digest[len("sha256:"):]
          files = (os.environ.get("FILE_PATHS") or os.environ["FILE"]).split()
          if not files:
              print("::error::file-path or file-paths required", file=sys.stderr)
              sys.exit(1)
          # PREFIX is treated literally (never as regex/executable); only the
          # 64 hex chars directly after it may vary.
          image_line = re.compile(re.escape(prefix) + r"[0-9a-f]{64}")
          changed = []
          for f in files:
              if not os.path.isfile(f):
                  print(f"::error::{f} is not a file in this workspace", file=sys.stderr)
                  sys.exit(1)
              with open(f, "r", encoding="utf-8") as fh:
                  data = fh.read()
              matches = list(image_line.finditer(data))
              if len(matches) != 1:
                  print(f"::error::{f}: expected exactly 1 image line with the prefix, found {len(matches)}", file=sys.stderr)
                  sys.exit(1)
              m = matches[0]
              new_data = data[:m.start()] + prefix + new_digest + data[m.end():]
              if new_data != data:
                  with open(f, "w", encoding="utf-8") as fh:
                      fh.write(new_data)
                  changed.append(f)
                  print(f"{f}: changed")
              else:
                  print(f"{f}: unchanged")
          if changed:
              print("changed=true")
              with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
                  fh.write("changed=true\n")
          else:
              print("digest unchanged, nothing to commit")
          PY
      - name: Commit + push
        if: steps.update.outputs.changed == 'true'
        id: push
        env:
          FILE: ${{ inputs.file-path }}
          FILE_PATHS: ${{ inputs.file-paths }}
          DIGEST: ${{ inputs.digest }}
          SHA: ${{ inputs.sha }}
          MSG: ${{ inputs.commit-message }}
          BOT_NAME: ${{ inputs.bot-name }}
          BOT_EMAIL: ${{ inputs.bot-email }}
          OPEN_PR: ${{ inputs.open-pr }}
          HEAD_BRANCH: ${{ inputs.head-branch }}
        run: |
          subst() {
            local s="$1"
            s="${s//\{digest12\}/${d:0:12}}"
            s="${s//\{digest\}/$d}"
            s="${s//\{sha7\}/${SHA:0:7}}"
            s="${s//\{sha\}/$SHA}"
            printf '%s' "$s"
          }
          d="${DIGEST#sha256:}"
          read -r -a files <<< "${FILE_PATHS:-$FILE}"
          [ "${#files[@]}" -gt 0 ] || { echo "::error::no files to commit"; exit 1; }
          for f in "${files[@]}"; do
            git ls-files --error-unmatch -- "$f" >/dev/null 2>&1 \
              || { echo "::error::$f is not a tracked file in this workspace"; exit 1; }
          done
          msg="$(subst "$MSG")"
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          head=""
          if [ "$OPEN_PR" = "true" ]; then
            head="$(subst "$HEAD_BRANCH")"
            [ -n "$head" ] || { echo "::error::open-pr requires a non-empty head-branch (or sha for default 'bump/{sha7}')"; exit 1; }
            git checkout -B "$head"
          fi
          git add -- "${files[@]}"
          git commit -m "$msg"
          if [ "$OPEN_PR" = "true" ]; then
            git push --force -u origin "$head"
            echo "head=$head" >> "$GITHUB_OUTPUT"
          else
            git push
          fi
          echo "msg=$msg" >> "$GITHUB_OUTPUT"
      - name: Create or update pull request
        if: steps.update.outputs.changed == 'true' && inputs.open-pr && steps.push.outputs.head != ''
        env:
          GH_TOKEN: ${{ secrets.token }}
          HEAD: ${{ steps.push.outputs.head }}
          MSG: ${{ steps.push.outputs.msg }}
          DIGEST: ${{ inputs.digest }}
          SHA: ${{ inputs.sha }}
          PR_TITLE: ${{ inputs.pr-title }}
          PR_BODY: ${{ inputs.pr-body }}
          BASE_BRANCH: ${{ inputs.base-branch }}
          AUTO_MERGE: ${{ inputs.auto-merge }}
        run: |
          subst() {
            local s="$1"
            s="${s//\{digest12\}/${d:0:12}}"
            s="${s//\{digest\}/$d}"
            s="${s//\{sha7\}/${SHA:0:7}}"
            s="${s//\{sha\}/$SHA}"
            printf '%s' "$s"
          }
          d="${DIGEST#sha256:}"
          title="$(subst "${PR_TITLE:-$MSG}")"
          if [ -n "$PR_BODY" ]; then
            body="$(subst "$PR_BODY")"
          else
            body="Automated digest bump: digest \`${d:0:12}\`${SHA:+ (sha ${SHA:0:7})}. Merge to roll the image."
          fi
          base="$BASE_BRANCH"
          [ -n "$base" ] || base="$(gh repo view --json defaultBranchRef -q .defaultBranchRef.name)"
          if gh pr view "$HEAD" --json number --jq .number >/dev/null 2>&1; then
            echo "PR already exists, updating"
            gh pr edit "$HEAD" --title "$title" --body "$body"
          else
            gh pr create --base "$base" --head "$HEAD" --title "$title" --body "$body"
          fi
          # Auto-merge is a gh pr merge operation (--auto/--squash are NOT gh pr
          # create flags). Enable it after create/edit so both new and existing
          # PRs behave identically; GitHub merges once required conditions pass.
          if [ "$AUTO_MERGE" = "true" ]; then
            state=$(gh pr view "$HEAD" --json state --jq .state)
            if [ "$state" = "OPEN" ]; then
              gh pr merge "$HEAD" --auto --squash
              echo "auto-merge enabled on $HEAD"
            else
              echo "PR state '$state'; auto-merge not enabled"
            fi
          fi
          echo "PR: $(gh pr view "$HEAD" --json url --jq .url)"
