# actionlint
#
# S2-owned source-acceptance check: lints all reusable workflows in this
# repository (the future builder/provenance trust anchor). Runs on PRs and
# pushes to main. Its exact check context ("actionlint") is required by the
# main-protection ruleset.
name: actionlint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Download actionlint 1.7.12 (checksum-verified)
        id: get_actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail

          archive="/tmp/actionlint.tar.gz"
          executable="/tmp/actionlint"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"

          curl -fsSLo "$archive" "$url"

          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -

          tar -xzf "$archive" -C /tmp actionlint

          "$executable" -version

          echo "executable=$executable" >> "$GITHUB_OUTPUT"
      - name: Lint workflows
        run: ${{ steps.get_actionlint.outputs.executable }} -color
