# container-build-push
#
# Builds and pushes a container image to GHCR (build side of the supply chain).
# GHCR-only: `image` is an ENFORCED trust input — every `tags` entry must start
# with the exact literal `${image}:` or the build fails. This prevents pushing
# the registry credential to an arbitrary registry and keeps `image` as a real
# consistency check rather than documentary metadata.
#
# provenance/SBOM are intentionally disabled here: attestation/SBOM generation
# is the explicit responsibility of the caller workflow using the project's
# actions/attest model — a single authoritative mechanism, no implicit second
# BuildKit provenance.
#
# Used by: app repos' CI (e.g. <org>/<repo-name>).
#
name: container-build-push
on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
        description: Full GHCR image name, e.g. ghcr.io/<org>/<repo-name>
      dockerfile:
        required: true
        type: string
        description: Path to the Dockerfile
      context:
        required: false
        type: string
        default: "."
        description: Build context directory (default repo root)
      platform:
        required: true
        type: string
        description: Build platform, e.g. linux/amd64
      runner:
        required: false
        type: string
        default: "ubuntu-latest"
        description: Runner for this build, e.g. ubuntu-24.04-arm for arm64
      tags:
        required: true
        type: string
        description: 'Whitespace/newline-separated tags to push; every tag must start with the literal `${image}:`'
    secrets:
      token:
        required: true
        description: GitHub token with packages write scope for ghcr.io (GITHUB_TOKEN or PAT)
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Validate image and tags (GHCR-only)
        env:
          IMAGE: ${{ inputs.image }}
          TAGS: ${{ inputs.tags }}
        run: |
          case "$IMAGE" in
            ghcr.io/*) ;;
            *) echo "::error::image must be ghcr.io/<owner>/<repo>, got '$IMAGE'"; exit 1 ;;
          esac
          # shellcheck disable=SC2086  # intentional word-splitting (whitespace/newline-separated list)
          for tag in $TAGS; do
            rest="${tag#"${IMAGE}:"}"
            if [ "$rest" = "$tag" ] || [ -z "$rest" ]; then
              echo "::error::tag '$tag' must start with '${IMAGE}:' and have a non-empty tag part"; exit 1
            fi
          done
          echo "validated ${IMAGE} and tags"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.token }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platform }}
          push: true
          tags: ${{ inputs.tags }}
          provenance: false
          sbom: false
