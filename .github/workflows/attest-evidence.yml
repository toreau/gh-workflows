# S1 evidence (temporary): reusable workflow as attestation SIGNER.
#
# When `actions/attest` runs inside this reusable workflow, the signer identity
# is THIS workflow (toreau/gh-workflows/.github/workflows/attest-evidence.yml),
# NOT the caller workflow. S1 proves identity/mechanism only; it does NOT define
# the production signer (that is S3 container-build-attest.yml, frozen in S4/S5).
#
# Two-job split (SLSA Build L3 control b: signing material must not be reachable
# from user-defined build steps):
#   build job  - no id-token / no attestations (no signing capability)
#   attest job - fresh GitHub-hosted runner, id-token + attestations
#
# Evidence artifact only: pushes an `s1-evidence-<caller-sha>-<run-id>` tag.
# Never `latest`, never `main-<sha>`. No dispatch, no promotion, no desired-state
# effect. k8s-research is read-only for S1.
name: attest-evidence

on:
  workflow_call:
    secrets:
      token:
        required: true
        description: Caller GITHUB_TOKEN with packages:write (registry push + OCI attestation push)

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ghcr.io/toreau/frosta-historielag.no
      tag: s1-evidence-${{ github.sha }}-${{ github.run_id }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Create controlled evidence Dockerfile
        env:
          TEMP: ${{ runner.temp }}
        run: |
          mkdir -p "$TEMP/s1-evidence"
          printf '%s\n' 'FROM busybox:1.36' 'CMD ["echo","s1-evidence"]' > "$TEMP/s1-evidence/Dockerfile"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.token }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: ${{ runner.temp }}/s1-evidence
          file: ${{ runner.temp }}/s1-evidence/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/toreau/frosta-historielag.no:s1-evidence-${{ github.sha }}-${{ github.run_id }}
          provenance: false
          sbom: false
      - name: Emit exact digest from build output
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "build-push digest output = ${DIGEST}"

  attest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.token }}
      - name: Generate SBOM against immutable digest
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          image: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
          format: spdx-json
          output-file: report.spdx.json
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4
        with:
          subject-name: ${{ needs.build.outputs.image }}
          subject-digest: ${{ needs.build.outputs.digest }}
          push-to-registry: true
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4
        with:
          subject-name: ${{ needs.build.outputs.image }}
          subject-digest: ${{ needs.build.outputs.digest }}
          sbom-path: report.spdx.json
          push-to-registry: true
      - name: Producer-side consistency check (not a trust boundary)
        env:
          GH_TOKEN: ${{ secrets.token }}
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
          REPO: ${{ github.repository }}
          SRC_SHA: ${{ github.sha }}
        run: |
          gh attestation verify "oci://${IMAGE}@${DIGEST}" --repo "$REPO" --bundle-from-oci \
            --signer-workflow toreau/gh-workflows/.github/workflows/attest-evidence.yml \
            --source-ref refs/heads/main --source-digest "$SRC_SHA" \
            --predicate-type https://slsa.dev/provenance/v1
          echo "producer consistency OK: ${IMAGE}@${DIGEST}"
