name: dispatch
on:
  workflow_call:
    inputs:
      target-repo:
        required: true
        type: string
        description: Repo to dispatch to, e.g. toreau/k8s-research
      event-type:
        required: true
        type: string
      payload:
        required: false
        type: string
        default: "{}"
        description: JSON object for client_payload
    secrets:
      token:
        required: true
permissions:
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch
        env:
          GH_TOKEN: ${{ secrets.token }}
          TARGET: ${{ inputs.target-repo }}
          EVENT: ${{ inputs.event-type }}
          PAYLOAD: ${{ inputs.payload }}
        run: |
          # -f client_payload=... sends a string, but the API expects an object;
          # build the JSON body and pipe it via --input -.
          jq -cn --arg event "$EVENT" --argjson payload "$PAYLOAD" \
            '{event_type:$event, client_payload:$payload}' \
            | gh api "repos/${TARGET}/dispatches" --input -
          echo "dispatched ${EVENT} to ${TARGET}"
