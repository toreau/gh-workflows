# native-pin-watcher
#
# Watches pinned native dependencies in a Dockerfile and opens an issue when
# an upstream moves to a newer tag/commit. Maintenance workflow — outside the
# build/promotion pipeline.
#
# `pins` is DATA-ONLY configuration — a JSON array of:
#   {name, type: "tag"|"commit", pattern, group, upstream}
# where `pattern` is a Python regex and `group` (>= 1) selects the capture
# group holding the pinned value. No executable fragments (shell/sed) are
# accepted. The workflow fails closed on any invalid entry.
name: native-pin-watcher
on:
  workflow_call:
    inputs:
      dockerfile:
        required: false
        type: string
        default: ""
        description: Path to the Dockerfile to scan for pinned native dependencies (required)
      pins:
        required: true
        type: string
        description: 'JSON array of data-only pins {name, type: tag|commit, pattern, group, upstream}; pattern is a Python regex, group >= 1 selects the capture group holding the pinned value'
      issue-title:
        required: false
        type: string
        default: "Native dependency update available"
        description: Title of the issue to open when an upstream moved
      labels:
        required: false
        type: string
        default: ""
        description: Comma-separated labels for the opened issue
    secrets:
      token:
        required: true
        description: GitHub token with issues:write for the calling repository
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Check native upstreams for newer versions
        id: check
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
          PINS_JSON: ${{ inputs.pins }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, sys

          dockerfile = os.environ["DOCKERFILE"]
          if not dockerfile:
              print("::error::dockerfile input is required", file=sys.stderr)
              sys.exit(1)
          try:
              with open(dockerfile, "r", encoding="utf-8") as fh:
                  lines = fh.read().splitlines()
          except OSError as e:
              print(f"::error::cannot read dockerfile {dockerfile}: {e}", file=sys.stderr)
              sys.exit(1)
          try:
              pins = json.loads(os.environ["PINS_JSON"])
          except json.JSONDecodeError as e:
              print(f"::error::pins is not valid JSON: {e}", file=sys.stderr)
              sys.exit(1)
          if not isinstance(pins, list):
              print("::error::pins must be a JSON array", file=sys.stderr)
              sys.exit(1)

          def version_key(tag):
              # Approximates `sort -V`: numeric runs compare as ints, the rest as strings.
              return [int(part) if part.isdigit() else part for part in re.split(r"([0-9]+)", tag)]

          results = []
          for i, pin in enumerate(pins):
              name = pin.get("name")
              ptype = pin.get("type")
              pattern = pin.get("pattern")
              group = pin.get("group")
              upstream = pin.get("upstream")
              missing = [k for k, v in (
                  ("name", name), ("type", ptype), ("pattern", pattern),
                  ("group", group), ("upstream", upstream),
              ) if v in (None, "")]
              if missing:
                  print(f"::error::pin[{i}] missing required field(s): {', '.join(missing)}", file=sys.stderr)
                  sys.exit(1)
              if ptype not in ("tag", "commit"):
                  print(f"::error::pin[{i}] '{name}': type must be 'tag' or 'commit', got '{ptype}'", file=sys.stderr)
                  sys.exit(1)
              if isinstance(group, bool) or not isinstance(group, int) or group < 1:
                  print(f"::error::pin[{i}] '{name}': group must be a positive integer", file=sys.stderr)
                  sys.exit(1)
              try:
                  rx = re.compile(pattern)
              except re.error as e:
                  print(f"::error::pin[{i}] '{name}': invalid regex: {e}", file=sys.stderr)
                  sys.exit(1)
              if group > rx.groups:
                  print(f"::error::pin[{i}] '{name}': capture group {group} does not exist (pattern has {rx.groups} group(s))", file=sys.stderr)
                  sys.exit(1)
              m = None
              for line in lines:
                  m = rx.search(line)
                  if m:
                      break
              if m is None:
                  print(f"::error::pin[{i}] '{name}': no match for pattern in {dockerfile}", file=sys.stderr)
                  sys.exit(1)
              pinned = m.group(group)
              if not pinned:
                  print(f"::error::pin[{i}] '{name}': capture group {group} matched an empty value", file=sys.stderr)
                  sys.exit(1)
              results.append({"name": name, "type": ptype, "pinned": pinned, "upstream": upstream})

          print("pinned checks:")
          changed_lines = []
          for pin in results:
              # upstream is used only as a URL argument to git ls-remote (no shell).
              repo_url = f"https://github.com/{pin['upstream']}.git"
              if pin["type"] == "tag":
                  proc = subprocess.run(["git", "ls-remote", "--tags", repo_url], capture_output=True, text=True)
                  tags = [ln.split("/")[-1] for ln in proc.stdout.splitlines() if not ln.endswith("^{}")]
                  latest = sorted(tags, key=version_key)[-1] if tags else ""
              else:
                  proc = subprocess.run(["git", "ls-remote", repo_url, "HEAD"], capture_output=True, text=True)
                  latest = proc.stdout.split()[0] if proc.stdout.split() else ""
              print(f"  {pin['name']}: pinned={pin['pinned']} latest={latest}")
              if pin["pinned"] and latest and pin["pinned"] != latest:
                  changed_lines.append(f"- {pin['name']}: pinned `{pin['pinned']}` -> latest `{latest}`")
          if changed_lines:
              with open("/tmp/changes.txt", "w", encoding="utf-8") as fh:
                  fh.write("\n".join(changed_lines) + "\n")
              with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
                  fh.write("changed=true\n")
              print("changed=true")
          else:
              print("No newer native upstreams.")
          PY
      - name: Open issue when an upstream moved
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.token }}
          TITLE: ${{ inputs.issue-title }}
          LABELS: ${{ inputs.labels }}
        run: |
          {
            echo "Native dependency update available:"
            echo
            cat /tmp/changes.txt
            echo
            echo "Review and bump the Dockerfile pins deliberately."
          } > /tmp/body.txt
          EXISTING=$(gh issue list --state open --search "in:title ${TITLE}" --json number --jq 'length')
          if [ "$EXISTING" -eq 0 ]; then
            args=(--title "${TITLE}" --body-file /tmp/body.txt)
            [ -n "$LABELS" ] && args+=(--label "$LABELS")
            gh issue create "${args[@]}"
          else
            echo "issue already exists"
          fi
